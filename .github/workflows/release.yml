name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: make install
      - name: Verificar versión y pin
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCK_TAG="$(node -p "require('./autoscript.lock.json').tag")"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"
          test "v${PACKAGE_VERSION}" = "${LOCK_TAG}"
      - run: make lint
      - run: make test
      - run: make build
      - run: mkdir artifacts
      - run: npm pack --pack-destination artifacts
      - name: Verificar el contenido del tarball
        run: |
          TARBALL="$(ls artifacts/*.tgz)"
          tar -tzf "${TARBALL}" | grep -q "package/vendor/autoscript.js"
          tar -xzOf "${TARBALL}" package/vendor/autoscript.js | shasum -a 256 | cut -d" " -f1 > /tmp/packed.sha
          node -p "require('./autoscript.lock.json').sha256" > /tmp/pinned.sha
          diff /tmp/packed.sha /tmp/pinned.sha
      # En todos los pasos se publica el mismo tarball ya verificado, no uno
      # nuevo: repetir el empaquetado daría un fichero distinto del que se
      # comprobó. La ruta lleva `./` a propósito: sin él, npm interpreta
      # `artifacts/x.tgz` como el atajo de GitHub `usuario/repo` e intenta
      # clonarlo por git.
      #
      # GitHub Packages va primero porque se autentica con el token del propio
      # workflow; npm exige tener registrado este fichero como publicador de
      # confianza, y si eso falla no debe impedir el resto de la publicación.
      - name: Publicar en GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          # El salto de línea inicial no es cosmético: el .npmrc que genera
          # setup-node no termina en salto, así que un append pegado a la
          # última línea produce `registry=https://registry.npmjs.org///npm.pkg…`
          # y npm se queda sin registro válido y sin credencial.
          printf '\n//npm.pkg.github.com/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" >> "${NPM_CONFIG_USERCONFIG:-${HOME}/.npmrc}"
          npm publish ./artifacts/*.tgz --registry=https://npm.pkg.github.com
      - run: npm publish ./artifacts/*.tgz
      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/*.tgz --generate-notes
