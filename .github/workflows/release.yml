name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: make install
      - name: Verificar versión y pin
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCK_TAG="$(node -p "require('./autoscript.lock.json').tag")"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"
          test "v${PACKAGE_VERSION}" = "${LOCK_TAG}"
      - run: make lint
      - run: make test
      - run: make build
      - run: mkdir artifacts
      - run: npm pack --pack-destination artifacts
      - name: Verificar el contenido del tarball
        run: |
          TARBALL="$(ls artifacts/*.tgz)"
          tar -tzf "${TARBALL}" | grep -q "package/vendor/autoscript.js"
          tar -xzOf "${TARBALL}" package/vendor/autoscript.js | shasum -a 256 | cut -d" " -f1 > /tmp/packed.sha
          node -p "require('./autoscript.lock.json').sha256" > /tmp/pinned.sha
          diff /tmp/packed.sha /tmp/pinned.sha
      - run: npm publish artifacts/*.tgz
      # Se publica el mismo tarball ya verificado, no uno nuevo: repetir el
      # empaquetado daría un fichero distinto del que se comprobó y del que se
      # subió a npm. GitHub Packages no admite Trusted Publishing, así que aquí
      # sí hace falta autenticarse, con el token efímero del propio workflow.
      - name: Publicar en GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          npm publish artifacts/*.tgz --registry=https://npm.pkg.github.com
      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/*.tgz --generate-notes
