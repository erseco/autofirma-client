name: Canary

on:
  push:
    branches: [main]
    # Solo lo que puede cambiar el paquete publicado. Un cambio de README o de
    # la web no altera el tarball, y publicar una versión idéntica con otro
    # número solo añade ruido al registro.
    paths:
      - "src/**"
      - "autoscript.lock.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "tsup.config.ts"
      - ".github/workflows/canary.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

# Si entran varios push seguidos, solo interesa publicar el último.
concurrency:
  group: canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: make install
      - run: make check
      # La base es el patch siguiente al de package.json, no el actual: una
      # preversión ordena por debajo de su versión, así que `1.9.2-canary.x`
      # quedaría por detrás de la 1.9.2 ya publicada pese a contener más
      # código. Con `1.9.3-canary.x` ordena por encima de 1.9.2 y por debajo de
      # un futuro 1.9.3, sin ocupar ese número.
      - name: Calcular la versión canary
        id: version
        run: |
          BASE="$(node -p "const [major, minor, patch] = require('./package.json').version.split('.'); [major, minor, Number(patch) + 1].join('.')")"
          echo "value=${BASE}-canary.$(date -u +%Y%m%d%H%M%S).${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"
      - name: Fijar la versión solo en el runner
        run: npm version "${{ steps.version.outputs.value }}" --no-git-tag-version
      - run: mkdir artifacts
      - run: npm pack --pack-destination artifacts
      - name: Verificar el contenido del tarball
        run: |
          TARBALL="$(ls artifacts/*.tgz)"
          tar -tzf "${TARBALL}" | grep -q "package/vendor/autoscript.js"
          tar -xzOf "${TARBALL}" package/vendor/autoscript.js | shasum -a 256 | cut -d" " -f1 > /tmp/packed.sha
          node -p "require('./autoscript.lock.json').sha256" > /tmp/pinned.sha
          diff /tmp/packed.sha /tmp/pinned.sha
      # GitHub Packages va primero porque se autentica con el token del propio
      # workflow y no depende de nada configurado fuera. npm exige registrar
      # este fichero como publicador de confianza, así que mientras eso no esté
      # hecho su paso falla; poniéndolo después, ese fallo no impide publicar
      # aquí.
      #
      # La ruta lleva `./` a propósito: sin él, npm interpreta `artifacts/x.tgz`
      # como el atajo de GitHub `usuario/repo` e intenta clonarlo por git.
      - name: Publicar en GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          npm publish ./artifacts/*.tgz --tag canary --registry=https://npm.pkg.github.com
      # `--tag canary` es lo que impide que estas versiones lleguen a quien
      # instala sin pedirlas: `latest` queda reservado a los tags de release.
      - run: npm publish ./artifacts/*.tgz --tag canary
      - name: Resumen
        run: echo "Publicada ${{ steps.version.outputs.value }} bajo el dist-tag canary" >> "${GITHUB_STEP_SUMMARY}"
